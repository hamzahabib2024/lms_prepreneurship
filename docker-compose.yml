# The whole System: database, API, web.
#
# THIS IS A SEPARATE PATH FROM `npm start`, and the two do not meet. `npm ci`,
# `npm run setup` and `npm start` run on the host and use the embedded
# PostgreSQL in ./pgdata; this runs three containers with their own database in
# a named volume. Neither can see the other's data, which is deliberate —
# pointing a container at ./pgdata would put two servers on one data directory.
#
# For LOCAL DEVELOPMENT you do not need any of this. `npm run setup` gives you
# a real PostgreSQL with no Docker at all. Use this for a SERVER, where the
# database, the API and nginx should be supervised and restarted for you.
#
# The entrypoint generates keys if absent and applies every migration and the
# constraints on each start. It does NOT seed: a seed writes development
# accounts with published passwords, and an entrypoint that ran it would put
# them on a production server.

services:
  postgres:
    # PostgreSQL 16 is mandated by §3.11: §8.4 needs partial and BRIN indexes
    # and DB-017 needs native partitioning.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      # A NAMED VOLUME, not ./pgdata. That directory is where `npm run db:start`
      # keeps the local embedded database, and pointing a container at the same
      # files would have two PostgreSQL servers writing one data directory.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    # DO NOT `--scale api=2` YET. ActorService caches each user's resolved
    # roles and scope in a per-PROCESS Map for 15 minutes (ARC-047). The purge
    # issued when somebody's roles change reaches only the node that handled
    # the request, so on a second node a REVOKED PERMISSION KEEPS WORKING for
    # up to fifteen minutes. That cache has to move to a shared store before
    # this service runs more than once.
    depends_on:
      postgres:
        # Waits for the database to ANSWER, not merely to exist. Without this
        # the entrypoint's migrate step races the server's first start.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lms}?schema=public
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-lms.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lms-api}
      BACKUP_DIR: /app/backups
      # ONE hop: the nginx container, and nothing else. Without this every
      # request appears to come from nginx, and the throttler — a global guard
      # keyed on the client address — gives the entire Institute a single
      # 300-per-minute budget. Raise it only if real proxies are added in
      # front, and never replace it with a blanket "trust the header": a client
      # can write anything into X-Forwarded-For and step around the rate limit.
      TRUST_PROXY_HOPS: 1
      # Not consulted while nginx makes the API same-origin — a browser does
      # not apply CORS to a same-origin request. Set explicitly anyway, because
      # the moment the API is served from a different hostname than the app the
      # default here is a development URL and every request fails CORS with an
      # error naming nothing anybody can act on.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      LOCAL_STORAGE_ROOT: /app/storage
      # HMACs the signed download URLs. The code falls back to a string
      # published in this repository, and anyone holding it can forge a URL for
      # ANY stored file — every payment slip and submission in the Institute —
      # so the stack refuses to start without a real one.
      LOCAL_STORAGE_SECRET: ${LOCAL_STORAGE_SECRET:?set LOCAL_STORAGE_SECRET in .env}
      # ------------------------------------------------------------- email
      #
      # NOT PASSED THROUGH IS NOT THE SAME AS NOT CONFIGURED, and the
      # difference is invisible. compose gives a container ONLY the variables
      # named in this block; .env is read to interpolate this FILE, it is not
      # injected into the services. Without these lines the API inside the
      # container has no mail settings at all, EmailChannel correctly reports
      # itself unconfigured, and every message is silently suppressed — on a
      # machine whose .env holds working credentials and whose host-side
      # `check-email.mjs` passes. That is precisely what happened here: a test
      # message sent from the host arrived, and the same code in the container
      # would have sent nothing.
      #
      # Two things leave the System by this route and neither is optional to
      # the person waiting for it: the tracking reference (FR-REG-018) and the
      # first password (FR-REG-042).
      MAIL_DRIVER: ${MAIL_DRIVER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Unset rather than defaulted, so an absent mailbox suppresses messages
      # instead of stopping the stack. A server that will not boot because
      # email is not set up yet is a worse failure than one that boots and
      # tells you email is not set up — which /system/integrations does.
      #
      # ---------------------------------------------------- what to link to
      #
      # The address a student is told to sign in at, in the welcome email. The
      # code's fallback is the DEVELOPMENT port (5173) because that is right
      # for `npm start`; on this stack the app is served on WEB_PORT, so
      # leaving it unset emails every new student a link to a port that is
      # serving nothing. Set it to the real hostname before this faces anyone.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:${WEB_PORT:-8080}}
      # Signs both messages. Without it they arrive from "the Institute".
      INSTITUTE_NAME: ${INSTITUTE_NAME:-Prepreneurship}
      # ------------------------------------------------- the rest of DEP-01
      #
      # Named here so that the day a key exists it is one .env edit rather
      # than a compose change nobody remembers to make. Absent, the storage
      # registry uses local disk and says so.
      # A PATH ON YOUR MACHINE IS NOT A PATH IN THE CONTAINER, and nothing
      # says so — the adapter simply reports itself unconfigured, exactly as it
      # would with no key at all.
      #
      # Worse on Windows: a value like E:\vs code\...\key.json arrives mangled,
      # because \v is a vertical tab. That is not a typo anybody spots by
      # reading it back.
      #
      # So the key is MOUNTED (see volumes below) and this always points at
      # where it lands inside the container. Set GOOGLE_CREDENTIALS_DIR in .env
      # to the FOLDER holding the key, with forward slashes, and
      # GOOGLE_SERVICE_ACCOUNT_FILE to the file's name within it.
      GOOGLE_SERVICE_ACCOUNT_JSON: /run/credentials/${GOOGLE_SERVICE_ACCOUNT_FILE:-none.json}
      # Where a folder picker starts when connecting a class to its recordings.
      # Optional: an id can always be pasted instead.
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      LECTURE_STORAGE: ${LECTURE_STORAGE:-local}
      DOCUMENT_STORAGE: ${DOCUMENT_STORAGE:-local}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      # The Institute's own numbering and thresholds. Defaulting these in the
      # image would give the Institute a registration number format chosen by
      # a developer (OPN-01).
      INSTITUTE_CODE: ${INSTITUTE_CODE:-}
      CAMPUS_CODE: ${CAMPUS_CODE:-}
      APPLY_LIMIT_PER_HOUR: ${APPLY_LIMIT_PER_HOUR:-10}
    volumes:
      # Keys OUTLIVE the container. Regenerating them on every restart would
      # invalidate every session and sign out the whole Institute.
      - api-keys:/app/keys
      # Backups likewise, and more obviously: a backup inside a container that
      # is replaced on the next deploy is not a backup.
      - api-backups:/app/backups
      # EVERY UPLOADED FILE. Until Google Drive is available (DEP-01) the
      # storage provider writes to the local disk, so payment slips, assignment
      # submissions and lesson resources all live here. Without this volume a
      # rebuild destroys the lot, silently — the rows survive and point at
      # files that are gone.
      - api-storage:/app/storage
      # The Google service-account key, read-only.
      #
      # A DIRECTORY rather than the file itself, because a bind mount of a
      # single file that does not exist creates a DIRECTORY with that name on
      # some platforms — and then the adapter reads a directory, fails to parse
      # it, and reports the key as invalid JSON.
      #
      # Defaults to ./credentials, which is committed empty and gitignored, so
      # the stack still starts on a machine with no key at all.
      - ${GOOGLE_CREDENTIALS_DIR:-./credentials}:/run/credentials:ro
    healthcheck:
      # Names the DATABASE check specifically, and deliberately.
      #
      # /system/health answers 200 while reporting "degraded", so testing the
      # HTTP status alone would call an API with a dead database healthy. And
      # testing status === "healthy" would NEVER pass, because redis and
      # storage report "not configured" by design and always will until DEP-01
      # lands. The database is the dependency whose loss makes the container
      # genuinely unusable, so that is the one the probe reads.
      #
      # Sets exitCode and lets the event loop drain rather than calling
      # process.exit() inside the callback — an abrupt exit mid-promise aborts
      # on some platforms, which would report a healthy API as unhealthy.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/system/health').then(r=>r.json()).then(b=>{if(b?.data?.checks?.database?.status!=='up')process.exitCode=1}).catch(()=>{process.exitCode=1})\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  api-keys:
  api-backups:
  api-storage:
