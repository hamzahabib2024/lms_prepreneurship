<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prepreneurship — Dream. Learn. Earn.</title>
    <meta
      name="description"
      content="Admissions, attendance, coursework, fees and certificates for Prepreneurship."
    />
    <!--
      The theme colour follows the reader's own setting, so the browser chrome
      on a phone matches the app rather than fighting it.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1a3c5e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e2540" />

    <!--
      THE MASTER ASSET, NOT A DRAWING OF IT.

      This was a "P" on an indigo gradient, drawn inline as an SVG data URI to
      save a request. §2.3 forbids exactly that — "Recreate the logo from
      scratch — always use the master asset" — and §2.4 wants the emblem alone
      at favicon size with the wordmark dropped out, which is what this is:
      cut from ppship-logo.png rather than redrawn.
    -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/brand/ppship-emblem.png" />
    <link rel="apple-touch-icon" href="/brand/ppship-emblem.png" />

    <!--
      The typefaces are Sora and Inter (Brand Guidelines V2.0 §4.1), imported
      from src/fonts.css and served from this origin. The note that used to sit
      here argued against a webfont; every objection in it was about Google's
      servers rather than about the typefaces, and self-hosting answers all of
      them. See fonts.css.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
