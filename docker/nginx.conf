server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # A single-page application: every path that is not a file is the app, which
  # renders the route itself. Without this a refresh on /timetable is a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ONE ORIGIN. The browser talks only to this server; nginx forwards the API
  # calls internally. That is what makes cookies and CORS behave the same here
  # as they do behind the Vite dev proxy.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API records the client address on security events and audit entries;
    # without this every one of them would read as the nginx container.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads are bounded at 12 MB by the multipart parser. nginx defaults to
    # 1 MB and would reject a legitimate submission before the API ever saw it,
    # with an error naming nothing a student could act on.
    client_max_body_size 12m;
  }
}
